<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Last Call — a solitaire twenty-one</title>
<style>
  :root{
    --bg: #150d1a;
    --gold: #c9a227;
    --gold-bright: #e6c65c;
    --cream: #f3ead8;
    --muted: #9c8aa8;
    --felt: #123526;
    --felt-dark: #0b241a;
    --serif: 'Playfair Display', Georgia, serif;
    --sans: 'Inter', system-ui, sans-serif;
  }
  *{ box-sizing:border-box; }
  body{
    margin:0;
    min-height:100vh;
    background: radial-gradient(circle at 50% 0%, #2a1c33 0%, var(--bg) 55%);
    color: var(--cream);
    font-family: var(--sans);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding: 32px 20px;
  }
  .frame{
    max-width: 480px;
    border: 1px solid rgba(201,162,39,0.35);
    border-radius: 24px;
    padding: 48px 32px;
    background: radial-gradient(ellipse at 50% 0%, var(--felt) 0%, var(--felt-dark) 85%);
    box-shadow: inset 0 0 60px rgba(0,0,0,0.45), 0 20px 50px rgba(0,0,0,0.5);
  }
  .glyphs{
    font-size: 1.4rem;
    letter-spacing: 0.5em;
    color: var(--gold);
    margin-bottom: 18px;
  }
  h1{
    font-family: var(--serif);
    font-size: clamp(2.2rem, 6vw, 3.2rem);
    margin: 0 0 8px;
    color: var(--gold-bright);
    text-shadow: 0 2px 12px rgba(201,162,39,0.25);
  }
  p{
    color: var(--muted);
    font-size: 0.95rem;
    line-height: 1.6;
    margin: 0 0 30px;
  }
  a.play{
    display:inline-block;
    font-family: var(--sans);
    font-weight: 600;
    letter-spacing: 0.04em;
    text-decoration: none;
    padding: 14px 36px;
    border-radius: 999px;
    border: 1px solid var(--gold);
    background: var(--gold);
    color: #241a2e;
    transition: transform 120ms ease, background 120ms ease;
  }
  a.play:hover{
    background: var(--gold-bright);
    transform: translateY(-2px);
  }
  .rules{
    margin-top: 26px;
    font-size: 0.78rem;
    color: var(--muted);
    letter-spacing: 0.03em;
  }
</style>
</head>
<body>
  <div class="frame">
    <div class="glyphs">♠ ♥ ♦ ♣</div>
    <h1>Last Call</h1>
    <p>A solitaire game of twenty-one. Play the dealer, manage your chips, no sign-up, no cost.</p>
    <a class="play" href="game.html">Enter the table</a>
    <div class="rules">Dealer stands on 17 &middot; blackjack pays 1.5x</div>
  </div>
</body>
</html>
