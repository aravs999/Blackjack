<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blackjack</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Blackjack</h1>

  <div class="stats">
    <span>Balance: $<b id="balance">500</b></span>
    <span>Bet: $<b id="bet">0</b></span>
    <span>Wins: <b id="wins">0</b></span>
    <span>Losses: <b id="losses">0</b></span>
    <span class="count-display">
      Count: <b id="running-count">0</b>
      <button class="count-help" type="button" aria-label="About card counting" aria-describedby="count-tooltip">?</button>
      <span class="tooltip" id="count-tooltip" role="tooltip">Card counting tracks exposed cards: 2–6 add 1, 7–9 do not change the count, and 10–A subtract 1. The count resets when the deck is shuffled.</span>
    </span>
  </div>

  <div id="table">
    <div id="dealer-area">
      <h2>Dealer</h2>
      <div id="dealer-cards"></div>
      <p>Total: <span id="dealer-total">–</span></p>
    </div>
    <div id="player-area">
      <h2>You</h2>
      <div id="player-cards"></div>
      <p>Total: <span id="player-total">–</span></p>
    </div>
  </div>

  <p id="message">Place a bet, then press Deal.</p>

  <div id="chips">
    <button class="chip" data-v="5">5</button>
    <button class="chip" data-v="25">25</button>
    <button class="chip" data-v="100">100</button>
    <button class="action" id="clear-btn">Clear bet</button>
  </div>

  <div>
    <button class="action" id="deal-btn" disabled>Deal</button>
    <button class="action" id="hit-btn" disabled>Hit</button>
    <button class="action" id="stand-btn" disabled>Stand</button>
    <button class="action" id="double-btn" disabled>Double down</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
