<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blackjack</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Blackjack</h1>

  <div class="stats">
    <span>Balance: $<b id="balance">500</b></span>
    <span>Bet: $<b id="bet">0</b></span>
    <span>Wins: <b id="wins">0</b></span>
    <span>Losses: <b id="losses">0</b></span>
  </div>

  <div id="table">
    <div id="dealer-area">
      <h2>Dealer</h2>
      <div id="dealer-cards"></div>
      <p>Total: <span id="dealer-total">–</span></p>
    </div>
    <div id="player-area">
      <h2>You</h2>
      <div id="player-cards"></div>
      <p>Total: <span id="player-total">–</span></p>
    </div>
  </div>

  <p id="message">Place a bet, then press Deal.</p>

  <div id="chips">
    <button class="chip" data-v="5">5</button>
    <button class="chip" data-v="25">25</button>
    <button class="chip" data-v="100">100</button>
    <button class="action" id="clear-btn">Clear bet</button>
  </div>

  <div>
    <button class="action" id="deal-btn" disabled>Deal</button>
    <button class="action" id="hit-btn" disabled>Hit</button>
    <button class="action" id="stand-btn" disabled>Stand</button>
    <button class="action" id="double-btn" disabled>Double down</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
